[project]
name = "jk-toretro"
description = "Retro graphics converter node for ComfyUI. Converts modern images to authentic retro computing styles (VGA, EGA, CGA, PC-98) with proper color palettes, dithering, and resolution constraints."
version = "1.0.0"
license = {file = "LICENSE"} 
# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["# Core dependencies", "wand", "Pillow", "numpy", "torch", "git+https://github.com/hbldh/hitherdither.git", "# Development dependencies", "black>=23.0.0", "flake8>=6.0.0", "pytest>=7.0.0", "# ComfyUI is assumed to be installed separately", "# ImageMagick is assumed to be installed separately"]

[project.urls]
Repository = "https://github.com/Nakamura2828/ComfyUI-JK-ToRetro"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/Nakamura2828/ComfyUI-JK-ToRetro/wiki"
"Bug Tracker" = "https://github.com/Nakamura2828/ComfyUI-JK-ToRetro/issues"

[tool.comfy]
PublisherId = ""
DisplayName = "ComfyUI-JK-ToRetro"
Icon = ""
includes = [] 
